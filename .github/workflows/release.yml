name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Build with the latest stable Go, not the minimum version in go.mod, so
      # the binaries get every standard library security fix.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true

      # Do not publish a release that fails its tests.
      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Test (e2e)
        run: go test -tags e2e ./...

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional publishing targets; set once the tap repo / AUR package exist.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
